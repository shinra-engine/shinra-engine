[package]
name = "se-web"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
se-abi.workspace = true
se-host.workspace = true
se-ecs.workspace = true
se-render.workspace = true
# Directly, not through `se-render`: the surface and its configuration are this
# crate's business — `se-render` owns no window on either route.
wgpu.workspace = true
anyhow.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = [
  "Document", "Element", "HtmlCanvasElement", "Window", "console",
  "Response", "GpuCanvasContext",
  # The readback path only: a 2D context and the pixels to put in it.
  "CanvasRenderingContext2d", "ImageData",
] }
